name: Il Meridiano

on:
  schedule:
    # Tres rodadas por dia, em UTC. No Rio: 6h, 12h e 18h.
    # De 3 em 3 horas eram 8 rodadas diarias, e assessoria publica nao
    # publica oito vezes por dia — a maioria das rodadas gastava Gemini
    # para nao achar nada novo.
    # Cinco horarios para conseguir tres rodadas.
    #
    # Agendamento no GitHub Actions nao tem hora garantida: a fila e de baixa
    # prioridade e, em periodo de carga, o proprio GitHub atrasa ou PULA a
    # execucao. Quanto mais raro o agendamento, mais chance de ser descartado.
    # Pedir cinco e aceitar que alguns falhem sai mais barato que o jornal
    # aparecer com doze horas de atraso.
    #
    # O robo descarta o que ja publicou, entao rodada a mais nao duplica
    # materia — no pior caso ela custa a coleta e nao escreve nada.
    - cron: '0 8,11,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Qual edicao gerar'
        required: false
        default: 'todas'
        type: choice
        options: ['todas', 'br', 'mundo', 'mt', 'rs', 'rj']

permissions: { contents: write }

jobs:
  # Cinco edicoes ao mesmo tempo. br e mundo cuidam do que e comum; as tres
  # estaduais cuidam so do regional e nao disputam vaga com Brasilia.
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        edicao: [br, mundo, mt, rs, rj]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/meridiano.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ESTADO: ${{ (inputs.edicao == 'todas' || inputs.edicao == '') && matrix.edicao || inputs.edicao }}
      - uses: actions/upload-artifact@v4
        with:
          name: edicao-${{ matrix.edicao }}
          # SO o proprio arquivo. Antes cada maquina enviava todos os
          # edicao-*.json que vieram no checkout, e ao juntar os pacotes a
          # copia velha de uma sobrescrevia a nova de outra.
          path: |
            dados/edicao-${{ matrix.edicao }}.json
            dados/arquivo/${{ matrix.edicao }}-*.json
            dados/arquivo/indice.json
            materia/
          retention-days: 1
          if-no-files-found: ignore

  publicar:
    needs: edicao
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: recebido, merge-multiple: true }
      - run: |
          mkdir -p dados materia
          cp -f recebido/dados/*.json dados/ 2>/dev/null || true
          mkdir -p dados/arquivo && cp -f recebido/dados/arquivo/*.json dados/arquivo/ 2>/dev/null || true
          cp -rf recebido/materia/* materia/ 2>/dev/null || true
          rm -rf recebido
          git config user.name "Meridiano"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados materia
          if git diff --staged --quiet; then
            echo "Nada mudou nesta rodada."
            exit 0
          fi
          git commit -m "edicao: br, mundo, mt, rs, rj"

          # O robo baixa o repositorio, trabalha uns minutos e so entao grava.
          # Se alguem subir arquivo pelo navegador nesse meio-tempo, o Git
          # recusa o envio para nao sobrescrever. Aqui buscamos o que chegou,
          # colocamos nosso commit por cima e tentamos de novo.
          for tentativa in 1 2 3; do
            if git push; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi
            echo "Alguem gravou antes. Buscando e tentando de novo..."
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep 4
          done

          echo "Nao consegui publicar depois de 3 tentativas."
          exit 1
