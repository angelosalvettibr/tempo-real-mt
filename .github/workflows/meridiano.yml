name: Il Meridiano

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Qual edicao gerar'
        required: false
        default: 'todas'
        type: choice
        options: ['todas', 'br', 'mundo', 'mt', 'rs', 'rj']

permissions: { contents: write }

jobs:
  # Cinco edicoes ao mesmo tempo. br e mundo cuidam do que e comum; as tres
  # estaduais cuidam so do regional e nao disputam vaga com Brasilia.
  edicao:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        edicao: [br, mundo, mt, rs, rj]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/meridiano.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ESTADO: ${{ (inputs.edicao == 'todas' || inputs.edicao == '') && matrix.edicao || inputs.edicao }}
      - uses: actions/upload-artifact@v4
        with:
          name: edicao-${{ matrix.edicao }}
          path: |
            dados/edicao-*.json
            dados/arquivo-*.json
            materia/
          retention-days: 1
          if-no-files-found: ignore

  publicar:
    needs: edicao
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: recebido, merge-multiple: true }
      - run: |
          mkdir -p dados materia
          cp -f recebido/dados/*.json dados/ 2>/dev/null || true
          cp -rf recebido/materia/* materia/ 2>/dev/null || true
          rm -rf recebido
          git config user.name "Il Meridiano"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados materia
          git diff --staged --quiet || (git commit -m "edicao: br, mundo, mt, rs, rj" && git push)
