name: Explorador

on:
  schedule:
    - cron: '30 9 * * *'      # uma vez por dia, 5h30 em Cuiaba
  workflow_dispatch:
    inputs:
      estado:
        description: 'Estado'
        required: false
        default: 'mt'
        type: choice
        options: ['mt', 'rs', 'rj']

permissions: { contents: write }

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/explorador.mjs
        env:
          ESTADO: ${{ inputs.estado || 'mt' }}
      - run: |
          git config user.name "Il Meridiano"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add dados/catalogo.json
          git diff --staged --quiet || (git commit -m "catalogo de fontes" && git push)
