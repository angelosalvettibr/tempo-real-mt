name: Varredura

on: { schedule: [ { cron: '0 */2 * * *' } ], workflow_dispatch: {} }

permissions: { contents: write }

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/varredura.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "Robo Tempo Real"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/edicao.json materia
          git diff --staged --quiet || (git commit -m "varredura automatica" && git push)
