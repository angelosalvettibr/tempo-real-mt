name: Varredura

on: { schedule: [ { cron: '0 */2 * * *' } ], workflow_dispatch: {} }

permissions: { contents: write }

jobs:
  varrer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/varredura.mjs
      - run: |
          git config user.name "Robo Tempo Real"
          git config user.email "robo@users.noreply.github.com"
          git add dados/edicao.json
          git diff --staged --quiet || (git commit -m "varredura automatica" && git push)
