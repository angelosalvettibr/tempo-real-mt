<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel de fontes — Meridiano</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Painel claro. O escuro cansava numa tela usada por horas e escondia
     campos de formulario — o de senha chegou a sumir no fundo. */
  --fundo:#F4F2ED; --painel:#FFFFFF; --painel2:#FAF9F6; --borda:#DDD8CC;
  --texto:#1A1713; --texto2:#55504A; --fraco:#8B8478;
  --viva:#1F7A3D; --instavel:#9A6B0C; --fora:#B3261E; --bloq:#6B3FA0; --quar:#1F5FA8;
  --mono:'IBM Plex Mono',monospace; --sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--fundo);color:var(--texto);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}

header{border-bottom:1px solid var(--borda);background:var(--painel);padding:16px 0}
header .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--fraco);font-weight:400}
.quando{font-family:var(--mono);font-size:11px;color:var(--fraco);margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--borda);border-bottom:1px solid var(--borda)}
.kpi{background:var(--painel);padding:16px 18px}
.kpi b{display:block;font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);display:block;margin-top:6px}
.kpi.v b{color:var(--viva)} .kpi.i b{color:var(--instavel)} .kpi.f b{color:var(--fora)}
.kpi.b b{color:var(--bloq)} .kpi.q b{color:var(--quar)}

.barras{padding:22px 0 6px}
.grupo{margin-bottom:20px}
.grupo h3{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fraco);margin-bottom:9px}
.barra{display:flex;height:26px;background:var(--painel);border:1px solid var(--borda);overflow:hidden}
.barra div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:600;color:#fff;min-width:2px;transition:.2s}
.barra div:hover{filter:brightness(1.15)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-family:var(--mono);font-size:10px;color:var(--texto2)}
.legenda i{width:9px;height:9px;display:inline-block;margin-right:5px}

.filtros{display:flex;gap:6px;flex-wrap:wrap;padding:7px 0;align-items:center}
.filtros .rot{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fraco);min-width:74px}
#filtros{padding:6px 0 16px;border-bottom:1px solid var(--borda);margin-bottom:16px}
.filtros button{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--borda);color:var(--texto2);padding:7px 12px;cursor:pointer;transition:.14s}
.filtros button:hover{border-color:var(--texto2);color:var(--texto)}
.filtros button[aria-pressed="true"]{background:var(--texto);border-color:var(--texto);color:var(--fundo);font-weight:600}
.filtros input{font-family:var(--mono);font-size:11px;background:var(--painel);border:1px solid var(--borda);color:var(--texto);padding:8px 11px;min-width:190px;margin-left:auto}
.filtros input::placeholder{color:var(--fraco)}

table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:40px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);text-align:left;padding:9px 10px;border-bottom:1px solid var(--borda);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--texto)}
td{padding:10px;border-bottom:1px solid var(--painel2);vertical-align:middle}
tr:hover td{background:var(--painel)}
.pt{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.pt::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pt.ativa{color:var(--viva)} .pt.instavel{color:var(--instavel)} .pt.fora{color:var(--fora)}
.pt.bloqueada{color:var(--bloq)} .pt.quarentena{color:var(--quar)}
.dom{font-family:var(--mono);font-size:11px;color:var(--texto2)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--borda);color:var(--texto2)}
.tag.livre{color:var(--viva);border-color:#1F4E2A}
.nota{font-family:var(--mono);font-size:12px;font-weight:600}
.spark{display:inline-flex;gap:1.5px;align-items:flex-end;height:16px}
.spark i{width:3px;background:var(--fora);display:block}
.spark i.ok{background:var(--viva)}
.vazio{text-align:center;padding:60px 20px;color:var(--fraco);font-family:var(--mono);font-size:12px}
.aviso{background:#2A1F0B;border:1px solid #4A3A14;color:#E8C46A;padding:13px 16px;margin:16px 0;font-family:var(--mono);font-size:11.5px;line-height:1.6}
@media (max-width:800px){ .esconde{display:none} .filtros input{margin-left:0;width:100%} }
.edicoes,.desemp,.red,.lt{background:var(--painel);border:1px solid var(--borda);border-radius:3px;
  padding:0 0 4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.edicoes,.desemp{padding:20px 22px}
.edicoes{margin:22px 0 20px}
.edicoes h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--texto);font-weight:600;margin:0 0 14px;padding-bottom:11px;border-bottom:2px solid var(--texto)}
.edicoes table{width:100%;border-collapse:collapse;font-size:13px}
.edicoes th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fraco);text-align:right;padding:8px 10px;border-bottom:1px solid var(--borda);font-weight:500;white-space:nowrap}
.edicoes th:first-child{text-align:left}
.edicoes td{padding:10px;border-bottom:1px solid var(--borda);text-align:right;font-family:var(--mono);font-size:12.5px}
.edicoes td:first-child{text-align:left;font-family:var(--sans);font-weight:600;font-size:13px}
.edicoes tr:hover{background:var(--painel)}
.edicoes .pc{font-size:11px;color:var(--fraco);margin-left:5px}
.edicoes .bom{color:#1F7A3D}.edicoes .meio{color:#9A6B0C}.edicoes .ruim{color:#B3261E}
.edicoes tfoot td{border-top:2px solid var(--borda);border-bottom:0;font-weight:700}
.edicoes .nota{font-family:var(--sans);font-size:12px;color:var(--fraco);margin-top:9px;line-height:1.5}
.desemp{margin:0 0 20px}
.desemp h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--texto);font-weight:600;margin:0 0 16px;padding-bottom:11px;border-bottom:2px solid var(--texto)}
.desemp .quadro{display:flex;gap:4px;align-items:flex-end;height:150px;border-bottom:1px solid var(--borda);padding-bottom:0}
.desemp .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;min-width:0}
.desemp .pilha{display:flex;flex-direction:column-reverse;gap:1px}
.desemp .fatia{width:100%;min-height:2px}
.desemp .f-conf{background:#1F7A3D}
.desemp .f-atrib{background:#9A6B0C}
.desemp .f-sem{background:#7A7268}
.desemp .col .tot{font-family:var(--mono);font-size:10px;color:var(--texto2);text-align:center;margin-bottom:4px}
.desemp .col:hover .pilha{opacity:.75}
.desemp .eixo{display:flex;gap:4px;margin-top:7px}
.desemp .eixo span{flex:1;font-family:var(--mono);font-size:9px;color:var(--fraco);text-align:center;min-width:0;overflow:hidden}
.desemp .legenda{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-family:var(--mono);font-size:10px;color:var(--fraco);letter-spacing:.06em}
.desemp .legenda i{width:9px;height:9px;display:inline-block;margin-right:6px;vertical-align:-1px}
.desemp .resumo{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--borda)}
.desemp .resumo div b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1;font-family:var(--sans)}
.desemp .resumo div span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);display:block;margin-top:6px}
.desemp .vazio{font-family:var(--mono);font-size:12px;color:var(--fraco);padding:26px 0;text-align:center}
.red{margin:0 0 20px}
.red .cab{padding:15px 20px;border-bottom:2px solid var(--texto);background:var(--painel2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.red .cab b{font-family:var(--mono);font-size:11px;color:var(--texto);font-weight:600;letter-spacing:.16em;letter-spacing:.15em;text-transform:uppercase;color:var(--texto2);font-weight:500}
.red .cab .aviso{font-family:var(--sans);font-size:11.5px;color:var(--fraco);margin-left:auto}
.red .corpo{padding:20px 22px}
.red label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);margin:14px 0 6px}
.red label:first-child{margin-top:0}
.red input,.red textarea,.red select{width:100%;background:var(--fundo);border:1px solid var(--borda);color:var(--texto);padding:10px 12px;font-family:var(--sans);font-size:14px;line-height:1.5}
.red textarea{min-height:150px;resize:vertical;font-family:var(--sans)}
.red input:focus,.red textarea:focus,.red select:focus{outline:none;border-color:var(--texto2)}
.red .dois{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:700px){.red .dois{grid-template-columns:1fr}}
.red .acoes{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.red button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;cursor:pointer;border:1.5px solid var(--borda);background:#fff;color:var(--texto2);border-radius:2px}
.red button:hover{border-color:var(--texto);color:var(--texto)}
.red button.ca{border-color:#1F5FA8;color:#1F5FA8}
.red button.ca:hover{background:#1F5FA8;color:#fff}
.red .doc{border:1px solid #B4D8BF;background:#EDF7F0;padding:12px 15px;margin-top:14px;font-size:13px;line-height:1.55;color:#1F7A3D}
.red .doc b{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:6px;color:#1F7A3D}
.red .doc a{color:#1F5FA8}
.red .doc.nao{border-color:#E2CE9A;background:#FBF3DF;color:#8A6510}
.red .doc.nao b{color:#9A6B0C}
.red button.ia{border-color:#6B3FA0;color:#7A4FBF}
.red button.ia:hover{background:#6B3FA0;color:#fff}
.red button.pub{border-color:#1F7A3D;color:#1F7A3D}
.red button.pub:hover{background:#1F7A3D;color:var(--fundo)}
.red button:disabled{opacity:.4;cursor:default}
.red .foto-area{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.red .foto-area input[type=file]{display:none}
.red .foto-area label.bt{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;cursor:pointer;border:1px solid var(--borda);color:var(--texto2);margin:0;display:inline-block}
.red .foto-area label.bt:hover{border-color:var(--texto);color:var(--texto)}
.red .previa{width:112px;height:74px;object-fit:cover;border:1px solid var(--borda)}
.red .msg{font-family:var(--mono);font-size:11.5px;margin-top:12px;min-height:16px}
.red .msg.erro{color:#B3261E}.red .msg.bom{color:#1F7A3D}
.red .lista{border-top:1px solid var(--borda);padding:14px 18px}
.red .lista h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);font-weight:500;margin:0 0 10px}
.red .lista .n{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--borda);font-size:13px}
.red .lista .n time{font-family:var(--mono);font-size:10.5px;color:var(--fraco);flex:none}
.red .lista .n span{flex:1;line-height:1.35}
.red .lista .n button{padding:4px 9px;font-size:9px;border-color:#E5B4B0;color:#B3261E}
.red .lista .n button.tog{border-color:var(--borda);color:var(--texto2)}
.red .lista .n button.ed{border-color:#B9D2EA;color:#1F5FA8}
.red .editando{background:#EAF1F8;border:1px solid #B9D2EA;padding:9px 14px;margin-bottom:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#1F5FA8;display:flex;align-items:center;gap:12px}
.red .editando button{margin-left:auto;padding:5px 11px;font-size:9px}
.red .lista .n .est{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid;flex:none}
.red .lista .n .est.no{color:#1F7A3D;border-color:#B4D8BF}
.red .lista .n .est.ras{color:#9A6B0C;border-color:#E2CE9A}
.red .lista .n small{font-family:var(--mono);font-size:9.5px;color:var(--fraco);flex:none}
.trava{padding:34px 18px;text-align:center}
/* O campo herdava a largura de bloco mas nao a caixa: sem display block e
   sem contraste proprio, ele sumia no fundo e so o botao aparecia. */
.trava input{display:block;width:100%;max-width:250px;margin:16px auto 0;padding:13px 15px;
  text-align:center;font-family:var(--mono);font-size:15px;letter-spacing:.22em;
  background:#fff;color:#1A1713;border:2px solid var(--texto);border-radius:3px}
.trava input::placeholder{color:#9AA4B0;letter-spacing:.14em}
.trava input:focus{outline:none;border-color:#1F5FA8}
.trava p{font-family:var(--sans);font-size:13px;color:var(--fraco);line-height:1.6;max-width:440px;margin:0 auto}
.lt{margin:0 0 40px}
.lt .cab{padding:15px 20px;border-bottom:2px solid var(--texto);background:var(--painel2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lt .cab b{font-family:var(--mono);font-size:11px;color:var(--texto);font-weight:600;letter-spacing:.16em;letter-spacing:.15em;text-transform:uppercase;color:var(--texto2);font-weight:500}
.lt .cab .aviso{font-family:var(--sans);font-size:11.5px;color:var(--fraco);margin-left:auto}
.lt .corpo{padding:20px 22px}
.lt label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);margin:14px 0 6px}
.lt label:first-child{margin-top:0}
.lt input,.lt textarea{width:100%;background:var(--fundo);border:1px solid var(--borda);color:var(--texto);padding:10px 12px;font-family:var(--sans);font-size:14px;line-height:1.5}
.lt textarea{resize:vertical;font-family:var(--sans)}
.lt #lt-relato{min-height:170px}
.lt #lt-links{min-height:70px;font-family:var(--mono);font-size:12px}
.lt .acoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.lt button{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:11px 16px;cursor:pointer;border:1.5px solid var(--borda);background:#fff;color:var(--texto2);border-radius:2px}
.lt button:hover{border-color:var(--texto);color:var(--texto)}
.lt button.ia{border-color:#6B3FA0;color:#7A4FBF}
.lt button.ia:hover{background:#6B3FA0;color:#fff}
.lt button:disabled{opacity:.4;cursor:default}
.lt .marco{border:1px solid var(--borda);padding:12px 14px;margin-bottom:9px;background:var(--fundo)}
.lt .marco .top{display:flex;gap:9px;margin-bottom:8px}
.lt .marco .top input{flex:none;width:170px;font-family:var(--mono);font-size:12px}
.lt .marco .top button{padding:5px 10px;font-size:9px;border-color:#E5B4B0;color:#B3261E;margin-left:auto}
.lt .marco textarea{min-height:62px;margin-bottom:8px}
.lt .marco .fon{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lt .marco .fon input{font-family:var(--mono);font-size:11.5px}
@media(max-width:700px){.lt .marco .fon{grid-template-columns:1fr}.lt .marco .top input{width:110px}}
.lt .consult{border:1px solid var(--borda);background:var(--painel2);padding:13px 15px;margin-top:14px}
.lt .consult b{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);display:block;margin-bottom:9px}
.lt .consult a{display:block;font-size:12.5px;color:var(--quar);text-decoration:none;padding:4px 0;line-height:1.4}
.lt .consult a:hover{text-decoration:underline}
.lt .msg{font-family:var(--mono);font-size:11.5px;margin-top:12px;min-height:16px}
.lt .msg.erro{color:#B3261E}.lt .msg.bom{color:#1F7A3D}
.lt .lista{border-top:1px solid var(--borda);padding:14px 18px}
.lt .lista h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fraco);font-weight:500;margin:0 0 10px}
.lt .lista .n{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--borda);font-size:13px;flex-wrap:wrap}
.lt .lista .n span.tt{flex:1;min-width:180px;line-height:1.35}
.lt .lista .est{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid;flex:none}
.lt .lista .est.pub{color:#1F7A3D;border-color:#B4D8BF}
.lt .lista .est.priv{color:#1F5FA8;border-color:#B9D2EA}
.lt .lista .est.ras{color:#9A6B0C;border-color:#E2CE9A}
.lt .lista .n button{padding:4px 9px;font-size:9px}
.lt .lista .n small{font-family:var(--mono);font-size:9.5px;color:var(--fraco);flex:none}
.lt .fila{border-top:1px solid var(--borda);padding:16px 22px;background:#EDF3F9}
.lt .fila h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#1F5FA8;font-weight:500;margin:0 0 10px}
.lt .fila .r{border:1px solid #B9D2EA;padding:12px 14px;margin-bottom:9px;background:var(--fundo)}
.lt .fila .r .m{font-family:var(--mono);font-size:9.5px;color:var(--fraco);letter-spacing:.08em;margin-bottom:7px;display:flex;gap:12px;flex-wrap:wrap}
.lt .fila .r p{font-size:13px;line-height:1.5;color:var(--texto2);max-height:74px;overflow:hidden;margin-bottom:9px}
.lt .fila .r .bts{display:flex;gap:7px}
.lt .fila .r button{padding:6px 12px;font-size:9px}
.lt .fila .r button.usar{border-color:#1F5FA8;color:#1F5FA8}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Painel de fontes <span>· Meridiano</span></h1>
  <a class="volta" href="linha.html" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto2);border:1px solid var(--borda);padding:7px 11px">Linha do tempo</a>
  <a class="volta" href="contar.html" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto2);border:1px solid var(--borda);padding:7px 11px">Página de relato</a>
  <a class="volta" href="arquivo.html" style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto2);border:1px solid var(--borda);padding:7px 11px">Arquivo de notícias</a>
    <span class="quando" id="quando">—</span>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<main class="wrap">
  <div class="edicoes" id="edicoes"></div>
  <div class="desemp" id="desemp"></div>
  <div class="red" id="redacao"></div>
  <div class="lt" id="linhatempo"></div>
  <div class="barras" id="barras"></div>

  <div id="filtros"></div>

  <div id="conteudo"><p class="vazio">Carregando catálogo…</p></div>
</main>

<script>
const CORES = { ativa:'#1F7A3D', instavel:'#9A6B0C', fora:'#B3261E', bloqueada:'#8B5CF6', quarentena:'#1F5FA8' };
const ROTULO = { ativa:'ativa', instavel:'instável', fora:'fora', bloqueada:'bloqueada', quarentena:'quarentena' };
let CAT = { fontes:{} }, busca = '', ordem = { campo:'nota', desc:true };

// Cada linha de filtro e uma entrada aqui. Para criar um filtro novo — por
// sistema, por nota minima, por ter foto — basta acrescentar um objeto.
const DIMENSOES = [
  { id:'estado',  rotulo:'Saúde',   campo:'estado',
    opcoes:[['todas','Todas'],['ativa','Ativas'],['instavel','Instáveis'],['fora','Fora do ar'],['bloqueada','Bloqueadas'],['quarentena','Quarentena']] },
  { id:'praca',   rotulo:'Praça',   campo:'uf',
    opcoes:[['todas','Todas'],['br','Nacional e Mundo'],['mt','Mato Grosso'],['rs','Rio Grande do Sul'],['rj','Rio de Janeiro']] },
  { id:'tipo',    rotulo:'Tipo',    campo:'tipo',
    opcoes:[['todas','Todos'],['veiculo','Veículos'],['assessoria','Assessorias'],['setorial','Setoriais'],['agencia','Agências']] },
  { id:'licenca', rotulo:'Licença', campo:'licenca',
    opcoes:[['todas','Todas'],['livre','Fonte livre'],['pauta','Só pauta']] },
  { id:'metodo',  rotulo:'Leitura', campo:'metodo',
    opcoes:[['todas','Todas'],['rss','RSS'],['pagina','Página'],['sitemap','Sitemap'],['google','Google']] }
];
const escolha = Object.fromEntries(DIMENSOES.map(d => [d.id, 'todas']));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lista = () => Object.values(CAT.fontes || {});

function kpis(){
  const f = lista();
  const c = e => f.filter(x => x.estado === e).length;
  const livre = f.filter(x => x.licenca === 'livre' && x.estado === 'ativa').length;
  $('#kpis').innerHTML = `
    <div class="kpi"><b>${f.length}</b><span>fontes no catálogo</span></div>
    <div class="kpi v"><b>${c('ativa')}</b><span>ativas</span></div>
    <div class="kpi i"><b>${c('instavel')}</b><span>instáveis</span></div>
    <div class="kpi f"><b>${c('fora')}</b><span>fora do ar</span></div>
    <div class="kpi b"><b>${c('bloqueada')}</b><span>bloqueadas</span></div>
    <div class="kpi q"><b>${c('quarentena')}</b><span>aguardando você</span></div>
    <div class="kpi v"><b>${livre}</b><span>fonte livre ativa</span></div>`;
}

function barra(titulo, campo, cores){
  const f = lista();
  const grupos = f.reduce((a,x) => { const k = x[campo] || 'outro'; a[k] = (a[k]||0)+1; return a; }, {});
  const total = f.length || 1;
  const ordenado = Object.entries(grupos).sort((a,b) => b[1]-a[1]);
  const paleta = ['#1F5FA8','#1F7A3D','#9A6B0C','#B3261E','#8B5CF6','#6B7684','#E6E9ED'];
  return `<div class="grupo"><h3>${titulo}</h3><div class="barra">${
    ordenado.map(([k,v],i) => {
      const cor = (cores && cores[k]) || paleta[i % paleta.length];
      return `<div style="width:${(v/total*100).toFixed(1)}%;background:${cor}" title="${esc(k)}: ${v}">${v/total > .07 ? v : ''}</div>`;
    }).join('')
  }</div><div class="legenda">${
    ordenado.map(([k,v],i) => {
      const cor = (cores && cores[k]) || paleta[i % paleta.length];
      return `<span><i style="background:${cor}"></i>${esc(ROTULO[k]||k)} ${v}</span>`;
    }).join('')
  }</div></div>`;
}

function sparkline(h){
  if (!h || !h.length) return '';
  return '<span class="spark">' + h.slice(-14).map(d =>
    `<i class="${d.ok?'ok':''}" style="height:${d.ok ? Math.max(4, Math.min(16, 4 + (d.itens||0))) : 3}px" title="${d.dia}: ${d.ok ? d.itens+' itens' : 'falhou'}"></i>`
  ).join('') + '</span>';
}

function filtrar(){
  let f = lista();
  for (const d of DIMENSOES) {
    const v = escolha[d.id];
    if (v !== 'todas') f = f.filter(x => (x[d.campo] || '') === v);
  }
  if (busca) {
    const b = busca.toLowerCase();
    f = f.filter(x => (x.nome||'').toLowerCase().includes(b) || (x.dominio||'').toLowerCase().includes(b));
  }
  return f;
}

function pintarFiltros(){
  const alvo = document.getElementById('filtros');
  alvo.innerHTML = DIMENSOES.map(d => `
    <div class="filtros">
      <span class="rot">${d.rotulo}</span>
      ${d.opcoes.map(([v,r]) => {
        const n = v === 'todas' ? lista().length : lista().filter(x => (x[d.campo]||'') === v).length;
        return `<button data-d="${d.id}" data-v="${v}" aria-pressed="${escolha[d.id]===v}" ${n===0&&v!=='todas'?'style="opacity:.35"':''}>${r}${v!=='todas'?` <span style="opacity:.6">${n}</span>`:''}</button>`;
      }).join('')}
      ${d.id === 'estado' ? '<input id="busca" placeholder="buscar nome ou domínio…">' : ''}
    </div>`).join('');

  alvo.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    escolha[b.dataset.d] = b.dataset.v;
    pintar();
  }));
  const bu = document.getElementById('busca');
  if (bu) {
    bu.value = busca;
    bu.addEventListener('input', e => { busca = e.target.value; pintar(); });
    if (busca) setTimeout(() => { bu.focus(); bu.setSelectionRange(busca.length, busca.length); }, 0);
  }
}

function tabela(){
  let f = filtrar();
  f.sort((a,b) => {
    const x = a[ordem.campo] ?? '', y = b[ordem.campo] ?? '';
    const r = typeof x === 'number' ? x - y : String(x).localeCompare(String(y));
    return ordem.desc ? -r : r;
  });

  if (!f.length) return '<p class="vazio">Nenhuma fonte com estes filtros.</p>';

  return `<p style="font-family:var(--mono);font-size:11px;color:var(--fraco);margin-bottom:10px">${f.length} de ${lista().length} fontes</p>
  <table>
    <thead><tr>
      <th data-o="nome">Fonte</th>
      <th data-o="dominio" class="esconde">Domínio</th>
      <th data-o="uf">Praça</th>
      <th data-o="tipo" class="esconde">Tipo</th>
      <th data-o="licenca">Licença</th>
      <th data-o="metodo">Leitura</th>
      <th data-o="estado">Estado</th>
      <th data-o="mediaItens" class="esconde">Itens</th>
      <th class="esconde">14 dias</th>
      <th data-o="nota">Nota</th>
      <th data-o="ultimoVivo" class="esconde">Visto vivo</th>
    </tr></thead>
    <tbody>${f.map(x => `<tr>
      <td><b>${esc(x.nome||x.chave)}</b>${x.motivo ? `<br><span class="dom" style="color:var(--fraco)">${esc(x.motivo).slice(0,44)}</span>` : ''}</td>
      <td class="dom esconde">${esc(x.dominio||'')}</td>
      <td class="dom">${esc((x.uf||'').toUpperCase())}</td>
      <td class="esconde"><span class="tag">${esc(x.tipo||'')}</span></td>
      <td><span class="tag ${x.licenca==='livre'?'livre':''}">${esc(x.licenca||'')}</span></td>
      <td class="dom">${esc(x.metodo||'')}</td>
      <td><span class="pt ${esc(x.estado)}">${esc(ROTULO[x.estado]||x.estado)}</span></td>
      <td class="dom esconde">${x.mediaItens ?? 0}</td>
      <td class="esconde">${sparkline(x.historico)}</td>
      <td class="nota" style="color:${x.nota>=70?'var(--viva)':x.nota>=40?'var(--instavel)':'var(--fora)'}">${x.nota ?? 0}</td>
      <td class="dom esconde">${esc(x.ultimoVivo||'—')}${x.diasFora ? ` <span style="color:var(--fora)">(${x.diasFora}d)</span>` : ''}</td>
    </tr>`).join('')}</tbody></table>`;
}

function pintar(){
  kpis();
  pintarFiltros();
  $('#barras').innerHTML =
    barra('Por estado', 'estado', CORES) +
    barra('Por tipo', 'tipo') +
    barra('Por método de leitura', 'metodo') +
    barra('Por praça', 'uf');

  const quar = lista().filter(x => x.estado === 'quarentena').length;
  const fora = lista().filter(x => x.estado === 'fora').length;
  const alerta = [];
  if (quar) alerta.push(`${quar} fonte${quar>1?'s':''} descoberta${quar>1?'s':''} aguardando sua aprovação.`);
  if (fora) alerta.push(`${fora} fonte${fora>1?'s':''} fora do ar há três dias ou mais.`);

  $('#conteudo').innerHTML = (alerta.length ? `<div class="aviso">${alerta.join(' ')}</div>` : '') + tabela();

  document.querySelectorAll('th[data-o]').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.o;
    ordem = { campo:c, desc: ordem.campo === c ? !ordem.desc : true };
    pintar();
  }));
}

// Quantas fontes o robo checou, quantas responderam, quantas entregaram
// artigo aproveitavel, e o que sobrou no fim do funil. Sai da propria edicao,
// nao do catalogo: e o retrato da ultima rodada de verdade.
const EDS = [['br','Brasil'],['mundo','Mundo'],['mt','Mato Grosso'],['rs','Rio Grande do Sul'],['rj','Rio de Janeiro']];

// Producao diaria, lida do arquivo — que e a memoria de verdade do jornal,
// nao da edicao do momento. Barra empilhada por nivel de evidencia: o que
// importa nao e quantas materias sairam, e quantas tinham documento.
/* ------------------------------ NOTA DA REDACAO -------------------------
   O que o robo nao alcanca: historia que voce apurou, assunto que nenhuma
   fonte livre cobriu, recado da redacao.

   A senha desta tela NAO protege nada — quem abrir o codigo-fonte a ve. Ela
   serve para manter curioso longe. A protecao real esta no /api/nota, que
   confere a senha no servidor antes de gravar qualquer coisa.               */
let senhaRedacao = '';
let editandoId = null;   // quando preenchido, salvar altera em vez de criar

function trava(){
  document.getElementById('redacao').innerHTML = `
    <div class="cab"><b>Nota da redação</b></div>
    <div class="trava">
      <p>Área de publicação manual. A nota entra no jornal com selo próprio, declarando que foi escrita pela redação e não confirmada pelo robô.</p>
      <input id="s-red" type="password" placeholder="senha" autocomplete="off">
      <div class="acoes" style="justify-content:center"><button id="bt-entrar">entrar</button></div>
      <p class="msg" id="m-red"></p>
    </div>`;
  const ent = async () => {
    const v = document.getElementById('s-red').value;
    const m = document.getElementById('m-red');
    m.className = 'msg'; m.textContent = 'verificando…';
    try {
      const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'entrar', senha:v }) })).json();
      if (r.ok) { senhaRedacao = v; formulario(); }
      else { m.className='msg erro'; m.textContent = r.msg || 'senha incorreta'; }
    } catch { m.className='msg erro'; m.textContent='falha de conexão'; }
  };
  document.getElementById('bt-entrar').addEventListener('click', ent);
  document.getElementById('s-red').addEventListener('keydown', e => { if (e.key==='Enter') ent(); });
}

function formulario(){
  document.getElementById('redacao').innerHTML = `
    <div class="cab"><b>Nota da redação</b>
      <span class="aviso">Sai com selo “Edição da redação” — não se passa por matéria confirmada.</span></div>
    <div class="corpo">
      <div class="editando" id="av-ed" style="display:none">
        editando uma nota já publicada<button id="bt-cancel">cancelar</button></div>
      <label>Fonte — de onde veio esta informação</label>
      <div class="dois">
        <input id="f-fonte" placeholder="ex.: Prefeitura de Cuiabá, apuração própria">
        <input id="f-link" placeholder="link do documento ou original (opcional)">
      </div>

      <label>Material bruto — cole aqui o que você tem</label>
      <textarea id="f-bruto" placeholder="Cole o texto, as anotações ou o release. A IA reescreve a partir disto, sem inventar nada que não esteja aqui."></textarea>

      <div class="acoes">
        <button class="ca" id="bt-cacar">procurar documento oficial</button>
        <button class="ia" id="bt-ia">reescrever com IA</button>
      </div>
      <div id="res-doc"></div>

      <label>Título</label>
      <input id="f-titulo" placeholder="preenchido pela IA, editável">
      <label>Linha de apoio</label>
      <input id="f-linha">
      <label>Texto final</label>
      <textarea id="f-corpo" placeholder="parágrafos separados por linha em branco"></textarea>

      <div class="dois">
        <div><label>Editoria</label>
          <select id="f-editoria">
            <option value="brasil">Brasil</option>
            <option value="internacional">Mundo</option>
            <option value="regional">Regional</option>
          </select></div>
        <div><label>Estado (só se regional)</label>
          <select id="f-uf"><option value="">—</option><option value="mt">Mato Grosso</option><option value="rs">Rio Grande do Sul</option><option value="rj">Rio de Janeiro</option></select></div>
      </div>

      <label>Foto (opcional)</label>
      <div class="foto-area">
        <label class="bt" for="f-arq">escolher imagem</label>
        <input type="file" id="f-arq" accept="image/*">
        <img class="previa" id="f-previa" style="display:none">
        <input id="f-foto" placeholder="ou cole um endereço https://…" style="flex:1;min-width:200px">
      </div>

      <div class="acoes">
        <button class="pub" id="bt-pub">publicar</button>
        <button id="bt-ras">salvar como rascunho</button>
      </div>
      <p class="msg" id="m-red"></p>
    </div>
    <div class="lista" id="l-red"></div>`;

  // Guarda o documento achado, se houver. E ele que decide o selo da nota:
  // com documento ela vale como confirmada; sem, e edicao da redacao.
  let documento = null;

  document.getElementById('bt-cacar').addEventListener('click', async () => {
    const bt = document.getElementById('bt-cacar'), cx = document.getElementById('res-doc');
    const t = document.getElementById('f-titulo').value.trim() || document.getElementById('f-bruto').value.trim().slice(0, 180);
    if (t.length < 20) { cx.innerHTML = '<div class="doc nao"><b>falta assunto</b>Escreva o título ou cole o material antes de procurar.</div>'; return; }

    bt.disabled = true; bt.textContent = 'procurando…'; cx.innerHTML = '';
    try {
      const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'cacar', senha:senhaRedacao, titulo:t, uf: document.getElementById('f-uf').value }) })).json();

      if (r.ok && r.achado) {
        documento = { link:r.link, fonte:r.fonte, titulo:r.titulo };
        document.getElementById('f-fonte').value = r.fonte;
        document.getElementById('f-link').value = r.link;
        cx.innerHTML = `<div class="doc"><b>documento encontrado</b>
          ${(r.fonte||'').replace(/[<>]/g,'')} — <a href="${r.link}" target="_blank" rel="noopener">abrir o registro</a><br>
          <small>A nota vai sair com selo <b>Confirmado oficialmente</b>. Cole o texto do documento no campo acima e reescreva a partir dele.</small></div>`;
      } else if (r.ok) {
        documento = null;
        cx.innerHTML = `<div class="doc nao"><b>nenhum registro encontrado</b>
          Procuramos em ${(r.procuradoEm||[]).length} ${(r.procuradoEm||[]).length === 1 ? 'órgão' : 'órgãos'}${(r.procuradoEm||[]).length ? ': ' + r.procuradoEm.join(', ').replace(/[<>]/g,'') : ''}.
          A nota sai como <b>edição da redação</b>, que é o honesto neste caso.</div>`;
      } else {
        cx.innerHTML = `<div class="doc nao"><b>falhou</b>${(r.msg||'').replace(/[<>]/g,'')}</div>`;
      }
    } catch { cx.innerHTML = '<div class="doc nao"><b>falha de conexão</b>Tente de novo.</div>'; }
    bt.disabled = false; bt.textContent = 'procurar documento oficial';
  });

  document.getElementById('bt-ia').addEventListener('click', async () => {
    const bt = document.getElementById('bt-ia'), m = document.getElementById('m-red');
    const bruto = document.getElementById('f-bruto').value.trim();
    if (bruto.length < 60) { m.className='msg erro'; m.textContent='cole mais material — a IA não inventa o que falta'; return; }
    bt.disabled = true; bt.textContent = 'escrevendo…'; m.className='msg'; m.textContent='';
    try {
      const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'reescrever', senha:senhaRedacao, texto:bruto,
          titulo: document.getElementById('f-titulo').value, fonte: document.getElementById('f-fonte').value }) })).json();
      if (r.ok) {
        document.getElementById('f-titulo').value = r.titulo;
        document.getElementById('f-linha').value = r.linha;
        document.getElementById('f-corpo').value = r.corpo.join('\n\n');
        m.className='msg bom'; m.textContent='texto gerado — revise antes de publicar';
      } else { m.className='msg erro'; m.textContent = r.msg || 'falhou'; }
    } catch { m.className='msg erro'; m.textContent='falha de conexão'; }
    bt.disabled = false; bt.textContent = 'reescrever com IA';
  });

  // Reduzir no navegador antes de enviar: foto de celular passa de 5 MB e a
  // funcao serverless nao aceita corpo desse tamanho. 1400px e mais que
  // suficiente para a capa e para o card do WhatsApp.
  document.getElementById('f-arq').addEventListener('change', async e => {
    const arq = e.target.files[0]; if (!arq) return;
    const m = document.getElementById('m-red');
    m.className='msg'; m.textContent='preparando imagem…';

    const menor = await new Promise((ok, falha) => {
      const img = new Image();
      img.onload = () => {
        const larg = Math.min(1400, img.width);
        const c = document.createElement('canvas');
        c.width = larg; c.height = Math.round(img.height * (larg / img.width));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => falha(new Error('não consegui ler a imagem'));
      img.src = URL.createObjectURL(arq);
    }).catch(() => null);

    if (!menor) { m.className='msg erro'; m.textContent='não consegui ler a imagem'; return; }

    m.textContent = 'enviando…';
    try {
      const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'imagem', senha:senhaRedacao, dados:menor, nome:arq.name }) })).json();
      if (r.ok) {
        document.getElementById('f-foto').value = r.url;
        const p = document.getElementById('f-previa');
        p.src = r.url; p.style.display = 'block';
        m.className='msg bom'; m.textContent='imagem no ar';
      } else { m.className='msg erro'; m.textContent = r.msg || 'falhou'; }
    } catch { m.className='msg erro'; m.textContent='falha ao enviar'; }
  });

  const enviar = async (rascunho) => {
    const m = document.getElementById('m-red');
    const dados = {
      acao: editandoId ? 'editar' : 'publicar',
      id: editandoId, senha:senhaRedacao, rascunho, documento,
      titulo: document.getElementById('f-titulo').value,
      linha: document.getElementById('f-linha').value,
      corpo: document.getElementById('f-corpo').value.split(/\n\s*\n/),
      fonte: document.getElementById('f-fonte').value,
      fonteLink: document.getElementById('f-link').value,
      foto: document.getElementById('f-foto').value,
      editoria: document.getElementById('f-editoria').value,
      uf: document.getElementById('f-uf').value
    };
    m.className='msg'; m.textContent = rascunho ? 'salvando…' : 'publicando…';
    try {
      const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(dados) })).json();
      if (r.ok) {
        m.className='msg bom'; m.textContent = editandoId ? 'alterações salvas' : (rascunho ? 'salva como rascunho' : 'no ar');
        limparForm();
        listaNotas();
      } else { m.className='msg erro'; m.textContent = r.msg || 'falhou'; }
    } catch { m.className='msg erro'; m.textContent='falha de conexão'; }
  };

  document.getElementById('bt-pub').addEventListener('click', () => enviar(false));
  document.getElementById('bt-ras').addEventListener('click', () => enviar(true));

  listaNotas();
  ltTela();
}

function limparForm(){
  ['f-bruto','f-titulo','f-linha','f-corpo','f-foto','f-fonte','f-link'].forEach(id => {
    const e = document.getElementById(id); if (e) e.value = '';
  });
  const p = document.getElementById('f-previa'); if (p) p.style.display = 'none';
  editandoId = null;
  const rd = document.getElementById('res-doc'); if (rd) rd.innerHTML = '';
  const av = document.getElementById('av-ed'); if (av) av.style.display = 'none';
  const bp = document.getElementById('bt-pub'); if (bp) bp.textContent = 'publicar';
}

// Traz a nota gravada de volta para o formulario. Sem isto, corrigir um erro
// de digitacao exigia apagar e reescrever tudo.
function carregarNota(n){
  editandoId = n.id;
  document.getElementById('f-titulo').value = n.titulo || '';
  document.getElementById('f-linha').value  = n.resumo || '';
  document.getElementById('f-corpo').value  = (n.corpo || []).join('\n\n');
  document.getElementById('f-fonte').value  = n.fonte || '';
  document.getElementById('f-link').value   = n.fonteLink || '';
  document.getElementById('f-foto').value   = n.foto || '';
  document.getElementById('f-editoria').value = n.editoria || 'brasil';
  document.getElementById('f-uf').value = n.uf || '';
  const p = document.getElementById('f-previa');
  if (n.foto) { p.src = n.foto; p.style.display = 'block'; } else { p.style.display = 'none'; }
  document.getElementById('av-ed').style.display = 'flex';
  document.getElementById('bt-pub').textContent = 'salvar alterações';
  document.getElementById('bt-cancel').onclick = limparForm;
  document.getElementById('redacao').scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ===================== LINHA DO TEMPO ==================================
   A pessoa conta a historia, cola os links, e o agente monta a cronologia.
   Voce revisa marco a marco e decide o estado:

     rascunho  em construcao, ninguem ve
     privada   pronta, fora da edicao, so abre com o endereco direto —
               e o relatorio entregue a quem pediu
     publica   entra na secao do jornal. So a redacao decide isso.        */

let ltEditando = null;

function ltTela(){
  const alvo = document.getElementById('linhatempo');
  if (!alvo || !senhaRedacao) return;
  alvo.innerHTML = `
    <div class="cab"><b>Linha do tempo</b>
      <span class="aviso">Só a redação decide o que vira pública. Privada não aparece na capa nem é indexada.</span></div>
    <div class="corpo">
      <label>A história, contada por quem viveu o caso</label>
      <textarea id="lt-relato" placeholder="Cole aqui o relato completo: o que aconteceu, quando, quem registrou. Quanto mais detalhe, melhor — o agente não inventa o que falta."></textarea>

      <label>Links de publicações, um por linha</label>
      <textarea id="lt-links" placeholder="https://…"></textarea>

      <div class="acoes"><button class="ia" id="lt-montar">buscar e montar a linha do tempo</button></div>
      <div id="lt-consult"></div>

      <div id="lt-form" style="display:none">
        <label>Título</label><input id="lt-titulo">
        <label>Linha de apoio</label><input id="lt-fina">
        <label>Introdução</label><textarea id="lt-intro" style="min-height:80px"></textarea>
        <label>Marcos — do mais recente ao mais antigo</label>
        <div id="lt-marcos"></div>
        <div class="acoes">
          <button id="lt-add">+ marco</button>
          <button id="lt-ras">salvar rascunho</button>
          <button id="lt-priv">salvar como privada</button>
          <button id="lt-pub">publicar no jornal</button>
          <button id="lt-cancel">limpar</button>
        </div>
      </div>
      <p class="msg" id="lt-msg"></p>
    </div>
    <div class="fila" id="lt-fila"></div>
    <div class="lista" id="lt-lista"></div>`;

  document.getElementById('lt-montar').addEventListener('click', ltMontar);
  document.getElementById('lt-add').addEventListener('click', () => ltMarco({}));
  document.getElementById('lt-cancel').addEventListener('click', ltLimpar);
  document.getElementById('lt-ras').addEventListener('click', () => ltSalvar('rascunho'));
  document.getElementById('lt-priv').addEventListener('click', () => ltSalvar('privada'));
  document.getElementById('lt-pub').addEventListener('click', () => ltSalvar('publica'));
  ltLista();
  ltFila();
}

// Os relatos que chegaram pela pagina de acesso restrito. Voce le, puxa para
// o formulario e faz a sua propria busca antes de montar.
async function ltFila(){
  const alvo = document.getElementById('lt-fila');
  if (!alvo) return;
  try {
    const r = await (await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'fila', senha:senhaRedacao }) })).json();
    const f = r.fila || [];
    alvo.innerHTML = '<h4>' + (f.length ? f.length + ' relato(s) recebido(s)' : 'nenhum relato recebido') + '</h4>' +
      f.map(x => `<div class="r">
        <div class="m"><span>${new Date(x.iso).toLocaleString('pt-BR')}</span>
          <span>${x.links.length} link(s)</span>
          ${x.contato ? `<span>${(x.contato||'').replace(/[<>]/g,'')}</span>` : '<span>sem contato</span>'}</div>
        <p>${(x.relato||'').replace(/[<>]/g,'').slice(0,420)}…</p>
        <div class="bts">
          <button class="usar" data-usar="${x.id}">usar este relato</button>
          <button data-fdel="${x.id}" style="border-color:#E5B4B0;color:#B3261E">descartar</button>
        </div></div>`).join('');

    alvo.querySelectorAll('button[data-usar]').forEach(b => b.addEventListener('click', () => {
      const x = f.find(y => y.id === b.dataset.usar); if (!x) return;
      document.getElementById('lt-relato').value = x.relato;
      document.getElementById('lt-links').value = (x.links||[]).join('\n');
      document.getElementById('linhatempo').scrollIntoView({ behavior:'smooth' });
    }));
    alvo.querySelectorAll('button[data-fdel]').forEach(b => b.addEventListener('click', async () => {
      await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'fila-apagar', senha:senhaRedacao, id:b.dataset.fdel }) });
      ltFila();
    }));
  } catch {}
}

function ltMarco(m){
  const cx = document.createElement('div');
  cx.className = 'marco';
  cx.innerHTML = `
    <div class="top">
      <input class="q" placeholder="agosto de 2010" value="${(m.quando||'').replace(/"/g,'&quot;')}">
      <button>remover</button>
    </div>
    <textarea class="t" placeholder="o fato, em uma a três frases">${m.texto||''}</textarea>
    <div class="fon">
      <input class="f" placeholder="origem: publicação, relatado pelo próprio…" value="${(m.fonte||'').replace(/"/g,'&quot;')}">
      <input class="l" placeholder="link (opcional)" value="${(m.link||'').replace(/"/g,'&quot;')}">
    </div>`;
  cx.querySelector('button').addEventListener('click', () => cx.remove());
  document.getElementById('lt-marcos').appendChild(cx);
}

const ltMarcos = () => [...document.querySelectorAll('#lt-marcos .marco')].map(c => ({
  quando: c.querySelector('.q').value, texto: c.querySelector('.t').value,
  fonte:  c.querySelector('.f').value, link:  c.querySelector('.l').value
}));

async function ltMontar(){
  const bt = document.getElementById('lt-montar'), m = document.getElementById('lt-msg');
  bt.disabled = true; bt.textContent = 'buscando…'; m.className='msg'; m.textContent='';
  const cx = document.getElementById('lt-consult'); if (cx) cx.innerHTML = '';
  try {
    const r = await (await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'montar', senha:senhaRedacao,
        relato: document.getElementById('lt-relato').value,
        links:  document.getElementById('lt-links').value }) })).json();
    if (r.ok) {
      document.getElementById('lt-titulo').value = r.titulo;
      document.getElementById('lt-fina').value   = r.linhaFina;
      document.getElementById('lt-intro').value  = r.intro;
      document.getElementById('lt-marcos').innerHTML = '';
      r.marcos.forEach(ltMarco);
      document.getElementById('lt-form').style.display = 'block';
      m.className='msg bom';
      ltFila();
      m.textContent = `${r.marcos.length} marcos montados — revise antes de decidir o estado` +
        (r.falta?.length ? ' · falta confirmar: ' + r.falta.join('; ') : '');
    } else { m.className='msg erro'; m.textContent = r.msg || 'falhou'; }
  } catch { m.className='msg erro'; m.textContent='falha de conexão'; }
  bt.disabled = false; bt.textContent = 'buscar e montar a linha do tempo';
}

async function ltSalvar(estado){
  const m = document.getElementById('lt-msg');
  m.className='msg'; m.textContent='salvando…';
  try {
    const r = await (await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'salvar', senha:senhaRedacao, id:ltEditando, estado,
        titulo: document.getElementById('lt-titulo').value,
        linhaFina: document.getElementById('lt-fina').value,
        intro: document.getElementById('lt-intro').value,
        marcos: ltMarcos() }) })).json();
    if (r.ok) {
      m.className='msg bom';
      m.textContent = estado === 'publica' ? 'publicada no jornal'
                    : estado === 'privada' ? 'salva como privada — endereço: /linha.html?id=' + r.linha.id
                    : 'rascunho salvo';
      ltEditando = r.linha.id;
      ltLista();
    } else { m.className='msg erro'; m.textContent = r.msg || 'falhou'; }
  } catch { m.className='msg erro'; m.textContent='falha de conexão'; }
}

function ltLimpar(){
  ltEditando = null;
  ['lt-relato','lt-links','lt-titulo','lt-fina','lt-intro'].forEach(id => {
    const e = document.getElementById(id); if (e) e.value = '';
  });
  document.getElementById('lt-marcos').innerHTML = '';
  document.getElementById('lt-form').style.display = 'none';
  document.getElementById('lt-msg').textContent = '';
}

async function ltLista(){
  const alvo = document.getElementById('lt-lista');
  if (!alvo) return;
  const NOME = { publica:'no jornal', privada:'privada', rascunho:'rascunho' };
  const CL   = { publica:'pub', privada:'priv', rascunho:'ras' };
  try {
    const r = await (await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'listar', senha:senhaRedacao }) })).json();
    const l = r.linhas || [];
    alvo.innerHTML = '<h4>' + (l.length ? l.length + ' linha(s) do tempo' : 'nenhuma linha do tempo ainda') + '</h4>' +
      l.map(x => `<div class="n">
        <span class="est ${CL[x.estado]}">${NOME[x.estado]}</span>
        <span class="tt">${(x.titulo||'').replace(/[<>]/g,'')}</span>
        <small>${x.marcos.length} marcos</small>
        <button data-ver="${x.id}">abrir</button>
        <button data-ed2="${x.id}">editar</button>
        <button data-del="${x.id}" style="border-color:#E5B4B0;color:#B3261E">apagar</button>
      </div>`).join('');

    alvo.querySelectorAll('button[data-ver]').forEach(b => b.addEventListener('click',
      () => window.open('/linha.html?id=' + b.dataset.ver, '_blank')));

    alvo.querySelectorAll('button[data-ed2]').forEach(b => b.addEventListener('click', () => {
      const x = l.find(y => y.id === b.dataset.ed2); if (!x) return;
      ltEditando = x.id;
      document.getElementById('lt-titulo').value = x.titulo;
      document.getElementById('lt-fina').value = x.linhaFina || '';
      document.getElementById('lt-intro').value = x.intro || '';
      document.getElementById('lt-marcos').innerHTML = '';
      (x.marcos||[]).forEach(ltMarco);
      document.getElementById('lt-form').style.display = 'block';
      document.getElementById('linhatempo').scrollIntoView({ behavior:'smooth' });
    }));

    alvo.querySelectorAll('button[data-del]').forEach(b => b.addEventListener('click', async () => {
      await fetch('/api/linha', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'apagar', senha:senhaRedacao, id:b.dataset.del }) });
      ltLista();
    }));
  } catch {}
}

async function listaNotas(){
  const alvo = document.getElementById('l-red');
  if (!alvo) return;
  const ONDE = { brasil:'Capa · Brasil', internacional:'Capa · Mundo', regional:'aba do estado' };
  try {
    // Com senha vem tudo, inclusive rascunho. O leitor so recebe o que esta no ar.
    const r = await (await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ acao:'listar', senha:senhaRedacao }) })).json();
    const n = r.notas || [];
    const noAr = n.filter(x => x.publicada !== false).length;

    alvo.innerHTML = '<h4>' + (n.length ? `${noAr} no ar · ${n.length - noAr} em rascunho` : 'nenhuma nota ainda') + '</h4>' +
      n.map(x => {
        const ok = x.publicada !== false;
        // Aviso util: regional sem estado nao aparece em aba nenhuma.
        const orfa = x.editoria === 'regional' && !x.uf;
        return `<div class="n">
          <time>${new Date(x.iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</time>
          <span class="est ${ok?'no':'ras'}">${ok?'no ar':'rascunho'}</span>
          <span>${(x.titulo||'').replace(/[<>]/g,'')}</span>
          <small>${orfa ? '⚠ regional sem estado — não aparece' : (ONDE[x.editoria]||'')}${x.uf?' '+x.uf.toUpperCase():''}</small>
          <button class="ed" data-ed="${x.id}">editar</button>
          <button class="tog" data-tog="${x.id}">${ok?'tirar do ar':'publicar'}</button>
          <button data-id="${x.id}">apagar</button></div>`;
      }).join('');

    alvo.querySelectorAll('button[data-ed]').forEach(b => b.addEventListener('click', () => {
      const n = (r.notas || []).find(x => x.id === b.dataset.ed);
      if (n) carregarNota(n);
    }));
    alvo.querySelectorAll('button[data-tog]').forEach(b => b.addEventListener('click', async () => {
      await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'alternar', senha:senhaRedacao, id:b.dataset.tog }) });
      listaNotas();
    }));
    alvo.querySelectorAll('button[data-id]').forEach(b => b.addEventListener('click', async () => {
      await fetch('/api/nota', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ acao:'apagar', senha:senhaRedacao, id:b.dataset.id }) });
      listaNotas();
    }));
  } catch {}
}
trava();

async function desempenho(){
  const alvo = document.getElementById('desemp');
  const meses = (() => { const o=[], d=new Date();
    for (let i=0;i<2;i++){ o.push(d.toISOString().slice(0,7)); d.setMonth(d.getMonth()-1); } return o; })();

  const pedidos = [];
  for (const [uf] of EDS) for (const m of meses)
    pedidos.push(fetch(`dados/arquivo/${uf}-${m}.json?t=`+Date.now(),{cache:'no-store'})
      .then(r => r.ok ? r.json() : null).catch(() => null));

  const itens = (await Promise.all(pedidos)).filter(Boolean).flatMap(b => b.itens || []);
  if (!itens.length) {
    alvo.innerHTML = '<h2>Produção diária</h2><p class="vazio">O arquivo ainda não tem histórico suficiente. O gráfico se forma sozinho a cada rodada.</p>';
    return;
  }

  // ultimos 14 dias, inclusive os vazios — dia sem materia e informacao
  const dias = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    dias.push(d.toISOString().slice(0,10));
  }
  const vistos = new Set();
  const porDia = Object.fromEntries(dias.map(d => [d, { conf:0, atrib:0, sem:0 }]));

  for (const i of itens) {
    const d = (i.iso || '').slice(0,10);
    if (!porDia[d]) continue;
    const k = i.id || i.titulo;
    if (vistos.has(k)) continue; vistos.add(k);
    const n = i.nivel || 'sem-confirmacao';
    porDia[d][n === 'confirmado' ? 'conf' : n === 'atribuido' ? 'atrib' : 'sem']++;
  }

  const total = d => porDia[d].conf + porDia[d].atrib + porDia[d].sem;
  const pico = Math.max(1, ...dias.map(total));
  const soma = k => dias.reduce((a,d) => a + porDia[d][k], 0);
  const tudo = soma('conf') + soma('atrib') + soma('sem');
  const comDado = dias.filter(d => total(d) > 0).length;
  const alt = n => Math.round(n / pico * 118);

  alvo.innerHTML = `
    <h2>Produção diária · últimos 14 dias</h2>
    <div class="quadro">${dias.map(d => {
      const p = porDia[d], t = total(d);
      return `<div class="col" title="${d.split('-').reverse().join('/')} — ${t} matérias">
        ${t ? `<div class="tot">${t}</div>` : ''}
        <div class="pilha">
          ${p.sem   ? `<div class="fatia f-sem"   style="height:${alt(p.sem)}px"></div>`   : ''}
          ${p.atrib ? `<div class="fatia f-atrib" style="height:${alt(p.atrib)}px"></div>` : ''}
          ${p.conf  ? `<div class="fatia f-conf"  style="height:${alt(p.conf)}px"></div>`  : ''}
        </div></div>`;
    }).join('')}</div>
    <div class="eixo">${dias.map(d => `<span>${d.slice(8)}/${d.slice(5,7)}</span>`).join('')}</div>
    <div class="legenda">
      <span><i style="background:#1F7A3D"></i>confirmado</span>
      <span><i style="background:#9A6B0C"></i>atribuído</span>
      <span><i style="background:#7A7268"></i>sem confirmação</span>
    </div>
    <div class="resumo">
      <div><b>${tudo}</b><span>matérias no período</span></div>
      <div><b>${comDado ? (tudo/comDado).toFixed(1) : '0'}</b><span>média por dia ativo</span></div>
      <div><b>${tudo ? Math.round(soma('conf')/tudo*100) : 0}%</b><span>com documento oficial</span></div>
      <div><b>${comDado}</b><span>dias com produção</span></div>
    </div>`;
}
desempenho();

async function edicoes(){
  const partes = await Promise.all(EDS.map(async ([uf,nome]) => {
    try {
      const r = await fetch(`dados/edicao-${uf}.json?t=` + Date.now(), { cache:'no-store' });
      return r.ok ? { uf, nome, j: await r.json() } : null;
    } catch { return null; }
  }));
  const vivas = partes.filter(Boolean);
  if (!vivas.length) return;

  const cor = p => p >= 60 ? 'bom' : p >= 30 ? 'meio' : 'ruim';
  const L = vivas.map(({ nome, j }) => {
    const f = j.fontes || {}, n = j.numeros || {};
    const ch = f.checadas || 0, ent = f.entregando || 0;
    return { nome, ch, resp:f.responderam||0, ent, pc: ch ? Math.round(ent/ch*100) : 0,
             itens:f.itens||0, conf:n.confirmadas||0, pub:(n.publicadas||0)+(n.resgatadas||0) };
  });
  const soma = k => L.reduce((a,x) => a + x[k], 0);
  const pcT = soma('ch') ? Math.round(soma('ent')/soma('ch')*100) : 0;
  const semDados = soma('ch') === 0;

  document.getElementById('edicoes').innerHTML = `
    <h2>Fontes por edição · última rodada</h2>
    <table>
      <thead><tr><th>edição</th><th>checadas</th><th>responderam</th><th>entregando</th>
      <th>itens colhidos</th><th>com documento</th><th>publicadas</th></tr></thead>
      <tbody>${L.map(x => `<tr>
        <td>${x.nome}</td><td>${x.ch || '—'}</td><td>${x.resp || '—'}</td>
        <td class="${cor(x.pc)}">${x.ent || '—'}${x.ch ? `<span class="pc">${x.pc}%</span>` : ''}</td>
        <td>${x.itens || '—'}</td><td>${x.conf}</td><td>${x.pub}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td>${soma('ch') || '—'}</td><td>${soma('resp') || '—'}</td>
        <td class="${cor(pcT)}">${soma('ent') || '—'}${soma('ch') ? `<span class="pc">${pcT}%</span>` : ''}</td>
        <td>${soma('itens') || '—'}</td><td>${soma('conf')}</td><td>${soma('pub')}</td></tr></tfoot>
    </table>
    <p class="nota">${semDados
      ? 'As colunas de fontes aparecem depois da próxima rodada do Meridiano — é ela que grava esses números.'
      : '<b>Checadas</b> é toda fonte que o robô tentou ler. <b>Responderam</b> devolveram alguma coisa. <b>Entregando</b> devolveram artigo aproveitável — dessas sai o texto. <b>Com documento</b> são histórias da pauta confirmadas em fonte oficial; <b>publicadas</b> é o que virou matéria.'}</p>`;
}
edicoes();
